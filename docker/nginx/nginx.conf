# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name 3ks2u.com www.3ks2u.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name 3ks2u.com www.3ks2u.com;
    client_max_body_size 50M;

    # gzip 压缩 — 显著减少 JS/CSS/HTML 传输体积
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/xml+rss image/svg+xml;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker 内网 DNS，每次请求动态解析，避免容器重启 IP 变化导致 502
    resolver 127.0.0.11 valid=30s;

    # index.html — 不缓存，保证发版后用户拿到最新页面
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 前端静态资源（带 hash 的 JS/CSS）— 长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # 上传文件 — nginx 直接 serve + 缓存
    location /uploads/ {
        alias /opt/host-uploads/;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # 前端路由 SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 后端 API — set 变量触发每次请求动态 DNS 解析
    location /api/ {
        set $backend_upstream backend:8081;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "max-age=15" always;
    }
}
