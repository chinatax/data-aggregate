server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: data-aggregate
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/data_aggregate?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&maxAllowedPacket=16777216
    username: dataagg
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      keepalive-time: 60000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# RocketMQ
rocketmq:
  name-server: localhost:9876
  producer:
    group: dataagg-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# 文件上传
upload:
  path: uploads

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000
  refresh-expiration: 604800000

# 微信开放平台
wechat:
  app-id: wx68268f281f07564b
  app-secret: ${WECHAT_APP_SECRET}
  redirect-uri: http://localhost:8081/api/auth/wechat/callback

# NewsData.io 新闻聚合
newsdata:
  api-key: ${NEWSDATA_API_KEY}
  tax-api-key: ${NEWSDATA_TAX_API_KEY}

# 股票数据采集（a-stock-data）
stock:
  index:
    initialDelay: 5000
    interval: 30000
  newsflash:
    initialDelay: 10000
    interval: 60000
  hottopic:
    initialDelay: 20000
    interval: 300000
  industry:
    initialDelay: 30000
    interval: 300000
  northbound:
    initialDelay: 5000
    interval: 60000
  margin:
    initialDelay: 10000
    interval: 300000
  dragonboard:
    initialDelay: 15000
    interval: 120000
  lockup:
    initialDelay: 20000
    interval: 3600000
  globalnews:
    initialDelay: 25000
    interval: 120000

# Blog file monitor
blog:
  data-path: blog
  monitor:
    initialDelay: 30000
    interval: 60000

# 日志
# 系统健康监控
health:
  mysql:
    check-interval: 3600000
    initial-delay: 120000
  api-self-test:
    interval: 300000
    initial-delay: 60000
    blog-id: 1
  log-file:
    path:
    max-size-gb: 2
    check-interval: 1800000
    initial-delay: 300000

logging:
  level:
    com.dataagg: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
