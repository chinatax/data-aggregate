    <meta name="description" content="数据聚合智能AI - 汇聚股票数据、电子书集、行政区划等多维度数据，提供一站式数据查询与洞察服务。涵盖税收政策、税务分析、财税数据等专业领域。" />
    <title>数据聚合智能AI</title>
    <style>
      /* ===== Page Loading Screen ===== */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.4s ease;
      }
      #app-loading.is-done {
        opacity: 0;
        pointer-events: none;
      }

      /* Background grid dots — subtle data texture */
      #app-loading::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 70%);
      }

      .loading-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      /* Logo mark — 原始CSS方块设计 */
      .loading-logo {
        width: 56px;
        height: 56px;
        position: relative;
      }
      .loading-logo::before,
      .loading-logo::after {
        content: '';
        position: absolute;
        border-radius: 2px;
      }
      .loading-logo::before {
        width: 32px;
        height: 32px;
        top: 0;
        left: 0;
        border: 3px solid #38BDF8;
        border-radius: 6px;
      }
      .loading-logo::after {
        width: 16px;
        height: 16px;
        bottom: 4px;
        right: 4px;
        background: #38BDF8;
        border-radius: 3px;
        opacity: 0.6;
        animation: logo-pulse 1.6s ease-in-out infinite;
      }
      @keyframes logo-pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.15); }
      }

      .loading-title {
        font-size: 22px;
        font-weight: 700;
        color: #212121;
        letter-spacing: 2px;
        font-family: 'Noto Serif SC', 'STSong', 'SimSun', 'PingFang SC', serif;
      }

      /* Progress bar track */
      .loading-bar-track {
        width: 200px;
        height: 3px;
        background: #EEEEEE;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      .loading-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #7dd3fc, #38BDF8, #0284C7);
        background-size: 200% 100%;
        animation:
          bar-slide 1.4s ease-in-out infinite,
          bar-shimmer 2s linear infinite;
        position: absolute;
        left: -20%;
      }
      @keyframes bar-slide {
        0%   { left: -20%; width: 30%; }
        60%  { left: 60%; width: 50%; }
        100% { left: 110%; width: 30%; }
      }
      @keyframes bar-shimmer {
        0%   { background-position: 0% 0%; }
        100% { background-position: 200% 0%; }
      }

      .loading-meta {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        color: #9E9E9E;
        letter-spacing: 1px;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .loading-dots span {
        display: inline-block;
        animation: dot-bounce 1.4s ease-in-out infinite;
      }
      .loading-dots span:nth-child(1) { animation-delay: 0s; }
      .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot-bounce {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }

      /* Loading bar for SPA route transitions (hidden initially) */
      .route-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        z-index: 99998;
        background: transparent;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .route-loader.is-active {
        opacity: 1;
      }
      .route-loader::after {
        content: '';
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #38BDF8, #0284C7);
        animation: route-load 1.2s ease-in-out infinite;
      }
      @keyframes route-load {
        0%   { width: 0%; margin-left: 0; }
        50%  { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="loading-wrap">
          <div class="loading-logo"></div>
          <!-- 根据路径动态显示 loading 标题 -->
          <script>
            (function() {
              var titles = {
                '/blog': '博客',
                '/stock': '股票数据',
                '/ebook': '电子书集',
                '/district': '行政区划',
                '/contact': '联系我们',
                '/login': '登录',
                '/register': '注册',
              };
              var path = window.location.pathname;
              var title = titles[path] || '数据聚合智能AI';
              document.write('<div class="loading-title">' + title + '</div>');
            })();
          </script>
          <noscript>
            <div class="loading-title">数据聚合智能AI</div>
          </noscript>
          <div class="loading-bar-track">
            <div class="loading-bar-fill"></div>
          </div>
          <div class="loading-meta">
            正在加载数据
            <span class="loading-dots">
              <span>·</span><span>·</span><span>·</span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
